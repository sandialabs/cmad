# Per specimen choices for the Jones 304L pipeline: the arguments the
# previews, the mesh generator, and the converter run with, settled by
# eye on the preview figures. One entry per specimen; the mesh and
# archive names derive from the cut values, h, and thickness.

# Every specimen shares the sheet thickness.
thickness: 1.5

xt10:
  geometry: data/jones_304l/X-Specimen-NominalGeometry.mat
  data: data/jones_304l/XT10-Data.mat
  frame min: 12
  frame max: 510
  drop threshold: 0.1
  exclude frames: [309, 498]
  y min: 63
  y max: 181
  h: 3
  curvature elements: 20
  num steps: 50
  roi band: 1.4

