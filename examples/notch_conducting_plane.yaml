# The notched plate of notch_conducting.yaml as a plate in plane stress:
# the z = 0 face of the same tet mesh in triangles, the whole 2 mm
# thickness in the input, the face loss to air through both faces as a
# term in the energy balance, the be_bar model in the displacement form
# (the mixed formulation is not written for plane stress). Its nodes are
# the 3D mesh's mid plane nodes, so the two solutions compare node by node.
#
# At t = 1 s the hole edge at (2, 0) reaches 308.83 K, against 308.66 K on
# the 3D mid plane.
#
# Generate the meshes as for notch_conducting.yaml, then from examples/:
#   cmad primal notch_conducting_plane.yaml

problem:
  type: fe
  name: notch_conducting_plane

discretization:
  mesh file: meshes/notch_10mm_plane.msh
  build coordinate sidesets: true
  thickness: 2.0
  num steps: 20
  step size: 0.05
  quadrature:
    volume degree: 2

residuals:
  global residual:
    type: thermomechanics
    def_type: plane_stress
  local residual:
    type: be_bar_elastic_plastic
    reference temperature: 300.0
    materials:
      solid:
        elastic: {E: 200.0e+3, nu: 0.3}
        plastic:
          effective stress: {J2: {}}
          flow stress:
            initial yield:
              Y: {table: {T: [300.0, 500.0], values: [335.4, 292.0]}}
            hardening: {voce_modulus: {H: 2625.0, D: 2.5}}
          taylor-quinney: 0.9
        thermal expansion: {alpha: 1.2e-5, reference temperature: 300.0}
        thermal:
          conductivity: 16.0
          density: 7.85e-9
          specific heat: 5.0e+8
          face convection: {h: 2.5e-2, T_inf: 300.0}

dirichlet bcs:
  expression:
    sym_x: [equilibrium, 0, xmin_sides, 0.0]
    sym_y: [equilibrium, 1, ymin_sides, 0.0]
    load_y: [equilibrium, 1, ymax_sides, 0.4 * t]
    grip_T: [energy balance, 0, ymax_sides, 300.0]

convection bcs:
  expression:
    edge: [energy balance, xmax_sides, 2.5e-2, 300.0]

output:
  path: results
  exodus filename: notch_conducting_plane.exo
  global residual: [u, T]
  local residual:
    solid: [cauchy, alpha, heat flux]
