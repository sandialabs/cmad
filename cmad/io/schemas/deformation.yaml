$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  history_file:
    type: string
  inline:
    type: array
    minItems: 2
    items:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: array
        minItems: 3
        maxItems: 3
        items: {type: number}
  times:
    type: array
    minItems: 2
    items: {type: number}
  times file: {type: string}
  num steps: {type: integer, minimum: 1}
  step size: {type: number, exclusiveMinimum: 0}
allOf:
  # The deformation gradient history: exactly one source, always required.
  - oneOf:
      - required: [history_file]
      - required: [inline]
  # The time history: at most one source. The first branch is the
  # "no time keys at all" case, which leaves every step at dt = 1.
  - oneOf:
      - allOf:
          - not: {required: [times]}
          - not: {required: [times file]}
          - not: {required: [num steps]}
          - not: {required: [step size]}
      - required: [times]
      - required: [times file]
      - required: [num steps, step size]
