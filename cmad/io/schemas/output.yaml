$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [path]
properties:
  path: {type: string}
  prefix: {type: string, default: ""}
  format:
    enum: [npy, text]
    default: npy
  exodus filename: {type: string}
  write exodus: {type: boolean, default: true}
  dic cloud:
    type: object
    additionalProperties: false
    required: [points file, sideset, output file]
    properties:
      points file: {type: string}
      sideset: {type: string}
      output file: {type: string}
  global residual:
    type: array
    items: {type: string}
  local residual:
    type: object
    additionalProperties:
      type: array
      items: {type: string}
