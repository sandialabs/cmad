$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [name]
additionalProperties: false
oneOf:
  - required: [data_file]
  - required: [calibration_data_file]
    not:
      required: [roi_file]
properties:
  name:
    const: fe_displacement_match
  data_file:
    type: string
  calibration_data_file:
    type: string
  match_times_file:
    type: string
  weight:
    type: number
  sideset:
    type: string
  roi_file:
    type: string
